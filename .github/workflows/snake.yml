name: Refresh contribution snake

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/snake.yml'
      - 'tools/style_snake.py'

permissions:
  contents: write

concurrency:
  group: profile-generated-assets
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
      - name: Generate contribution animation
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?color_snake=#b7ff5a&color_dots=#10251e,#124331,#146448,#20996c,#43e6f6
      - name: Style animation and create reduced-motion version
        run: |
          cp dist/github-snake-dark.svg output/github-snake-dark.svg
          python3 tools/style_snake.py
      - name: Commit generated animation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- output/github-snake-dark.svg assets/contributions-static.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: refresh contribution animation'
          git pull --rebase origin main
          git push origin HEAD:main
