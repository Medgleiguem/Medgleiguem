name: Profile checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test activity calculations and privacy filtering
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Validate README and artwork
        run: python3 tools/verify_profile.py
      - name: Check reproducible artwork
        run: |
          python3 tools/generate_assets.py
          git diff --exit-code -- assets/
