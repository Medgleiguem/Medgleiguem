name: Refresh profile activity

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/update_activity.py'
      - 'tools/generate_assets.py'
      - 'tools/desert_console.py'
      - 'tools/activity_data.py'
      - 'tools/activity_dashboard.py'
      - 'tools/expertise.py'
      - 'tools/test_activity.py'
      - '.github/workflows/profile-activity.yml'

permissions:
  contents: write

concurrency:
  group: profile-generated-assets
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Test date calculations and privacy boundary
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v

      - name: Fetch aggregate activity and render workbench
        env:
          # Optional account token can reveal additional aggregate activity.
          # No private repository identifiers are requested or saved.
          GITHUB_TOKEN: ${{ secrets.PROFILE_ACTIVITY_TOKEN || github.token }}
        run: python3 tools/update_activity.py --user Medgleiguem

      - name: Validate generated SVG files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for path in Path('assets').glob('workbench*.svg'):
              ET.parse(path)
          PY

      - name: Commit refreshed activity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/activity.json work/activity.md assets/workbench.svg assets/workbench-mobile.svg assets/workbench-static.svg assets/workbench-mobile-static.svg assets/workbench-compact.svg assets/workbench-compact-static.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: refresh profile activity'
          git pull --rebase origin main
          git push origin HEAD:main
