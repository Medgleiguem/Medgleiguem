4" font-size="10" fill="#c5d1df" font-weight="600" text-anchor="middle" class="mono">SOURCES</text><rect x="218" y="26" width="84" height="46" rx="9" fill="#101d2b" stroke="#35475a"/><text x="260" y="54" font-size="10" fill="#c5d1df" font-weight="600" text-anchor="middle" class="mono">CONTEXT</text><rect x="0" y="244" width="84" height="46" rx="9" fill="#101d2b" stroke="#35475a"/><text x="42" y="272" font-size="10" fill="#c5d1df" font-weight="600" text-anchor="middle" class="mono">PRODUCT</text><rect x="218" y="244" width="84" height="46" rx="9" fill="#101d2b" stroke="#35475a"/><text x="260" y="272" font-size="10" fill="#c5d1df" font-weight="600" text-anchor="middle" class="mono">ANSWERS</text><rect x="112" y="122" width="76" height="76" rx="22" fill="#142b30" stroke="#70f0cb" stroke-opacity=".7"/><path d="m135 149 15-9 15 9-15 9z m-15 0v14l15 9 15-9v-14 m-15 9v14" fill="none" stroke="#70f0cb" stroke-width="2" stroke-linejoin="round"/><text x="150" y="325" font-size="9" fill="#8eacc0" font-weight="500" text-anchor="middle" class="mono" letter-spacing="1">FROM CONTEXT TO SOMETHING USEFUL</text></g><path d="M56 400H1144" stroke="#b5d2d8" stroke-opacity=".15"/><text x="56" y="432" font-size="11" fill="#a5b4c7" font-weight="500" class="mono">NOUAKCHOTT, MAURITANIA · UTC+0</text><text x="1144" y="432" font-size="11" fill="#a5b4c7" font-weight="500" text-anchor="end" class="mono">CONTEXT → SYSTEMS → IMPACT</text>
