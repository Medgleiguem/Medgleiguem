<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
<title id="title">Mohamed Gleiguem — technical lead, AI, data, security and software engineering</title><desc id="desc">Mohamed Gleiguem — technical lead, AI, data, security and software engineering. Decorative animation respects reduced motion.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111a2e"/><stop offset="1" stop-color="#090e1b"/></linearGradient>
 <linearGradient id="border"><stop stop-color="#a78bfa" stop-opacity=".7"/><stop offset=".5" stop-color="#22d3ee" stop-opacity=".3"/><stop offset="1" stop-color="#34d399" stop-opacity=".5"/></linearGradient>
 <radialGradient id="violet"><stop stop-color="#8b5cf6" stop-opacity=".23"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
 <radialGradient id="cyan"><stop stop-color="#22d3ee" stop-opacity=".16"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
 <linearGradient id="shine"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#a0b5dd" stroke-opacity=".045"/></pattern>
 <clipPath id="frame"><rect x="1" y="1" width="998" height="498" rx="20"/></clipPath>
</defs>
<style>
 text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}
 .mono{font-family:Consolas,'Liberation Mono',monospace}
 .flow{stroke-dasharray:4 16;animation:flow 12s linear infinite}
 .orbit{transform-box:fill-box;transform-origin:center;animation:orbit 36s linear infinite}
 .float{animation:float 9s ease-in-out infinite alternate}
 .pulse{animation:pulse 5s ease-in-out infinite}
 .cursor{animation:cursor 1.4s steps(2,end) infinite}
 .aurora{animation:aurora 18s ease-in-out infinite alternate}
 .trace{stroke-dasharray:80 600;animation:trace 12s linear infinite}
 .icon-line{stroke-dasharray:100;animation:draw 9s ease-in-out infinite}
 .icon-bob{animation:float 5s ease-in-out infinite alternate}
 .beam{animation:beam 14s linear infinite}
 .role{opacity:0;animation:role 20s linear infinite}
 .role.first{opacity:1}
 .r1{animation-delay:5s}.r2{animation-delay:10s}.r3{animation-delay:15s}
 @keyframes flow{to{stroke-dashoffset:-240}}
 @keyframes trace{to{stroke-dashoffset:-1360}}
 @keyframes orbit{to{transform:rotate(360deg)}}
 @keyframes float{to{transform:translateY(-7px)}}
 @keyframes pulse{50%{opacity:.4}}
 @keyframes cursor{50%{opacity:0}}
 @keyframes aurora{to{transform:translate(28px,-16px) scale(1.05)}}
 @keyframes role{0%,22%{opacity:1}25%,100%{opacity:0}}
 @keyframes draw{0%,35%,100%{stroke-dashoffset:0}65%{stroke-dashoffset:90}}
 @keyframes beam{from{transform:translateX(-400px)}to{transform:translateX(1200px)}}
 @media(prefers-reduced-motion:reduce){*{animation:none!important}.role{opacity:0!important}.role.first{opacity:1!important}}
</style>
<g clip-path="url(#frame)"><rect width="1000" height="500" fill="url(#bg)"/>
<rect width="1000" height="500" fill="url(#grid)"/><ellipse class="aurora" cx="180" cy="60" rx="470" ry="400" fill="url(#violet)"/><ellipse class="aurora" cx="1000" cy="500" rx="500" ry="450" fill="url(#cyan)"/><polygon class="beam" points="0,0 120,0 350,500 230,500" fill="url(#shine)"/><text x="36" y="42" font-size="14" fill="#c4b5fd" font-weight="700" class="mono" letter-spacing="2">MG / ENGINEERING</text><text x="964" y="42" font-size="12" fill="#92a6c8" font-weight="500" text-anchor="end" class="mono">NOUAKCHOTT · UTC+0</text><path d="M36 62H964" stroke="#8b9bbe" stroke-opacity=".17"/><text x="36" y="114" font-size="15" fill="#67e8f9" font-weight="700" class="mono" letter-spacing="1.2">TECHNICAL LEAD · AI &amp; SOFTWARE</text><text x="32" y="191" font-size="69" fill="#f1f5ff" font-weight="800" letter-spacing="-2">MOHAMED</text><text x="32" y="269" font-size="69" fill="#c4b5fd" font-weight="800" letter-spacing="-2">GLEIGUEM</text><text x="36" y="317" font-size="23" fill="#d8e1f3" font-weight="500" >AI systems. Data platforms.</text><text x="36" y="351" font-size="23" fill="#d8e1f3" font-weight="500" >Security-minded software.</text><g class="float"><rect x="620" y="100" width="340" height="290" rx="16" fill="#111a2e" stroke="#a78bfa" stroke-opacity=".28" /><circle cx="642" cy="123" r="4" fill="#fb7185"/><circle cx="660" cy="123" r="4" fill="#fbbf24"/><circle cx="678" cy="123" r="4" fill="#34d399"/><text x="936" y="128" font-size="12" fill="#92a6c8" font-weight="500" text-anchor="end" class="mono">profile.yml</text><text x="642" y="173" font-size="14" fill="#c4b5fd" font-weight="500" class="mono">engineer:</text><text x="642" y="192" font-size="14" fill="#c8daed" font-weight="500" class="mono">Mohamed Gleiguem</text><text x="642" y="219" font-size="14" fill="#c4b5fd" font-weight="500" class="mono">focus:</text><text x="642" y="238" font-size="14" fill="#c8daed" font-weight="500" class="mono">AI · Data · Security</text><text x="642" y="265" font-size="14" fill="#c4b5fd" font-weight="500" class="mono">work:</text><text x="642" y="284" font-size="14" fill="#c8daed" font-weight="500" class="mono">Richat Partners</text><text x="642" y="311" font-size="14" fill="#c4b5fd" font-weight="500" class="mono">languages:</text><text x="642" y="330" font-size="14" fill="#c8daed" font-weight="500" class="mono">[AR, FR, EN]</text></g><path class="flow" d="M590 145H602V412H920V400" fill="none" stroke="#22d3ee" stroke-opacity=".7"/><circle class="pulse" cx="602" cy="412" r="4" fill="#22d3ee"/><text x="36" y="410" font-size="14" fill="#6ee7b7" font-weight="600" class="mono" letter-spacing=".5">BUILD → TEST → REVIEW → SHIP → LEARN</text><path d="M36 438H964" stroke="#8b9bbe" stroke-opacity=".17"/><text x="36" y="474" font-size="13" fill="#b5c4de" font-weight="500" class="mono" letter-spacing=".5">AI / DATA / SECURITY / WEB / MOBILE / RESEARCH</text><text x="964" y="474" font-size="12" fill="#67e8f9" font-weight="500" text-anchor="end" class="mono">CONTEXT → SYSTEMS → IMPACT</text></g>
<rect x="1" y="1" width="998" height="498" rx="20" fill="none" stroke="url(#border)" stroke-opacity=".7"/>
</svg>
