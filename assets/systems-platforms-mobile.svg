<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-labelledby="title desc">
<title id="title">DATA + IDENTITY + PAYMENTS</title><desc id="desc">ANRPTS / BI Houwiyeti: Multi-source data pipelines, dimensional models and analytics. Flow: Source systems, Airflow + landing, dbt + marts, Analytics workspace; Taazour Aoun: Beneficiary eligibility, identity checks and wallet-transfer journeys. Flow: Eligibility, OTP + eKYC, Wallet selection, Transfer state; Taazour Pay: Household payment orchestration with provider and duplicate controls. Flow: Household checks, Identity capture, Provider adapter, Payment lock; KYC Identity: Identity capture, liveness and face verification for partner apps. Flow: Identity checks, Browser capture, Liveness + match, Partner result. All motion stops for reduced-motion preferences.</desc>
