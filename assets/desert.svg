<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-labelledby="title desc">
<title id="title">Med Gleiguem — software, data, AI, security and research</title><desc id="desc">Med Gleiguem. Software, data, AI, security and research, with an etched geometric facade and moving dune line.</desc>
<defs><clipPath id="clip"><rect width="1000" height="250" rx="4"/></clipPath>
<linearGradient id="shade"><stop stop-color="#080d12" stop-opacity=".85"/><stop offset=".48" stop-color="#080d12" stop-opacity=".35"/><stop offset="1" stop-color="#080d12" stop-opacity="0"/></linearGradient>
<linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#080d12" stop-opacity="0"/><stop offset="1" stop-color="#080d12"/></linearGradient>
</defs><style>
text{font-family:'Liberation Sans',Arial,sans-serif}
.mono{font-family:Consolas,'Liberation Mono',monospace}
.name{font-family:'Liberation Sans Narrow','Arial Narrow',Arial,sans-serif;font-weight:900}
.flow{stroke-dasharray:2 98;animation:travel 10s linear infinite}
.sand{stroke-dasharray:14 86;animation:travel 18s linear infinite}
.slow{animation-duration:17s}.fast{animation-duration:7s}
.breathe{animation:breathe 8s ease-in-out infinite}
.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 90s linear infinite}
@keyframes travel{to{stroke-dashoffset:-100}}
@keyframes breathe{0%,100%{opacity:.3}50%{opacity:.85}}
@keyframes orbit{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.flow,.sand{stroke-dasharray:none;opacity:.45}}
</style><g clip-path="url(#clip)"><rect width="1000" height="250" fill="#080d12"/><text x="40" y="91" font-size="70" fill="#f2eee5" font-weight="700" letter-spacing="-2">Med Gleiguem</text><text x="43" y="135" font-size="27" fill="#a9bbc4" class="mono">@Medgleiguem</text><text x="43" y="183" font-size="23" fill="#f2eee5" class="mono">SOFTWARE / DATA / AI / SECURITY / RESEARCH</text><g transform="translate(809 31) scale(1.2)" fill="none" stroke="#e2b76f" stroke-width="1.3" stroke-linejoin="round"><path d="M6 136V25h12V11h14v14h15V11h14v14h15V11h14v14h18v111M0 136h116M43 136V85q15-22 31 0v51M33 46h50M33 57h50"/><path d="M10 66l7-6 7 6-7 6Z"/><path d="M80 66l7-6 7 6-7 6Z"/><path d="M10 88l7-6 7 6-7 6Z"/><path d="M80 88l7-6 7 6-7 6Z"/><path d="M10 110l7-6 7 6-7 6Z"/><path d="M80 110l7-6 7 6-7 6Z"/></g><g transform="translate(809 31) scale(1.2)"><path d="M43 135V85Q58 63 74 85v50" fill="none" stroke="#55dce3" stroke-width="1" opacity=".18"/><path class="flow " pathLength="100" d="M43 135V85Q58 63 74 85v50" fill="none" stroke="#55dce3" stroke-width="2.4" stroke-linecap="round" style="animation-delay:-3s"/></g><path d="M24 16h36" stroke="#e2b76f" stroke-width="3"/><path d="M0 232Q200.0 214 470.0 233T1000 228" fill="none" stroke="#36434a"/><path d="M0 232Q200.0 214 470.0 233T1000 228" fill="none" stroke="#e2b76f" stroke-width="1" opacity=".18"/><path class="flow slow" pathLength="100" d="M0 232Q200.0 214 470.0 233T1000 228" fill="none" stroke="#e2b76f" stroke-width="2.4" stroke-linecap="round" style="animation-delay:-0s"/></g></svg>
