g><text x="110" y="542" font-size="20" fill="#34d399" font-weight="800" class="mono">RUNNER-UP</text><text x="48" y="595" font-size="29" fill="#eef2ff" font-weight="700" >DATATHON 2026</text><text x="48" y="631" font-size="27" fill="#eef2ff" font-weight="600" >BAMIS Bank</text><text x="48" y="677" font-size="21" fill="#aebbd3" font-weight="400" >Fraud detection · 2026</text><rect x="24" y="726" width="552" height="210" rx="16" fill="#111a2e" stroke="#fb7185" stroke-opacity=".28" /><g transform="translate(48 756) scale(1.5833333333333333)" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path class="icon-line" d="M7 3h10v6a5 5 0 0 1-10 0z M7 5H3v3c0 3 4 4 5 3 M17 5h4v3c0 3-4 4-5 3 M12 14v5 M7 22h10 M9 19h6v3"/></g><text x="110" y="776" font-size="20" fill="#fb7185" font-weight="800" class="mono">3RD PLACE</text><text x="48" y="829" font-size="29" fill="#eef2ff" font-weight="700" >0xMR CTF</text><text x="48" y="865" font-size="27" fill="#eef2ff" font-weight="600" >Pro Hacker level</text><text x="48" y="911" font-size="21" fill="#aebbd3" font-weight="400" >Competing as MGL · 2026</text></g>
<rect x="1" y="1" width="598" height="958" rx="20" fill="none" stroke="url(#border)" stroke-opacity=".7"/>
