<svg xmlns="http://www.w3.org/2000/svg" width="600" height="84" viewBox="0 0 600 84" role="img" aria-labelledby="title desc">
<title id="title">./activity</title><desc id="desc">./activity. All motion stops for reduced-motion preferences.</desc>
<defs>
 <clipPath id="frame"><rect x="1" y="1" width="598" height="82" rx="8" /></clipPath>
 <linearGradient id="shade"><stop stop-color="#02090d" stop-opacity=".72" /><stop offset=".52" stop-color="#02090d" stop-opacity=".25" /><stop offset="1" stop-color="#02090d" stop-opacity="0" /></linearGradient>
 <linearGradient id="vertical-shade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#060b0e" stop-opacity="0" /><stop offset=".45" stop-color="#060b0e" stop-opacity=".9" /><stop offset=".7" stop-color="#060b0e" /></linearGradient>
 <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 0H4" stroke="#000" stroke-opacity=".18" /></pattern>
 <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#43e6f6" stop-opacity="0" /><stop offset="1" stop-color="#43e6f6" stop-opacity=".11" /></linearGradient>
</defs>
<style>
text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace}
.rain{}
.drift{}
.scan{}
.flow{stroke-dasharray:6 22;}
.glitch{}
.type-mask{transform-box:fill-box;transform-origin:left;}
.cursor{}
.role{opacity:0;}
.role.first{opacity:1}.r1{}.r2{}.r3{}
.icon{}









@media(prefers-reduced-motion:reduce){*{}.role{opacity:0!important}.role.first{opacity:1!important}}
</style>
<g clip-path="url(#frame)"><rect width="600" height="84" fill="#060b0e" /><text x="24" y="31" font-size="14" fill="#9ab8b0" font-weight="500">MGL / WORKSPACE</text><text x="24" y="65" font-size="30" fill="#b7ff5a" font-weight="700">./activity</text><path class="flow" d="M360 47H576" stroke="#43e6f6" stroke-opacity=".6" /></g>
<path d="M1 28V1H28 M572 1H599V28 M1 56V83H28 M572 83H599V56" fill="none" stroke="#b7ff5a" stroke-opacity=".6" />
<style>*{animation:none!important}.type-mask{transform:none!important}.module,.role{opacity:0!important}.module.first,.role.first{opacity:1!important}</style></svg>
