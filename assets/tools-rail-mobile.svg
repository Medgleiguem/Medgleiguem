#e8edf2" >Airflow</text><path d="M26.0 282h160.0" stroke="#2c465b"/><path class="flow" style="animation-delay:-9s" d="M26.0 282h160.0" stroke="#9bc9e3"/><text x="210.0" y="267" font-size="23" fill="#e8edf2" >dbt</text><path d="M210.0 282h160.0" stroke="#2c465b"/><path class="flow" style="animation-delay:-10s" d="M210.0 282h160.0" stroke="#9bc9e3"/><text x="394.0" y="267" font-size="23" fill="#e8edf2" >Redis</text><path d="M394.0 282h160.0" stroke="#2c465b"/><path class="flow" style="animation-delay:-11s" d="M394.0 282h160.0" stroke="#9bc9e3"/></g></svg>
