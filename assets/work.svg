x="945" cy="367" r="29" fill="#fb7185" fill-opacity=".065"/><g transform="translate(930 352) scale(1.25)" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path class="icon-line" d="M12 2 3 6v6c0 5 9 10 9 10s9-5 9-10V6z M8 12l3 3 5-6"/></g><text x="544" y="360" font-size="12" fill="#fb7185" font-weight="700" class="mono" letter-spacing="1">DATATHON / PRIVATE</text><text x="544" y="402" font-size="26" fill="#eef2ff" font-weight="700" >BAMIS Sentinel</text><text x="544" y="444" font-size="19" fill="#aebbd3" font-weight="400" >Fraud detection with explainable scoring,</text><text x="544" y="471" font-size="19" fill="#aebbd3" font-weight="400" >graph investigation and reproducible</text><text x="544" y="498" font-size="19" fill="#aebbd3" font-weight="400" >deliverables.</text><text x="544" y="565" font-size="12" fill="#fb7185" font-weight="600" class="mono">FRAUD ANALYTICS / GRAPH / ML</text><path class="flow" d="M544 583H968" stroke="#fb7185" stroke-opacity=".35"/><rect x="24" y="616" width="472" height="272" rx="16" fill="#111a2e" stroke="#fbbf24" stroke-opacity=".28" /><rect x="25" y="644" width="3" height="52" rx="1" fill="#fbbf24"/><circle class="pulse" cx="449" cy="663" r="29" fill="#fbbf24" fill-opacity=".065"/><g transform="translate(434 648) scale(1.25)" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path class="icon-line" d="M4 3h16v18H4z M8 7h8 M8 11h8 M8 15h5"/></g><text x="48" y="656" font-size="12" fill="#fbbf24" font-weight="700" class="mono" letter-spacing="1">PERSONAL PROJECT / LIVE</text><text x="48" y="698" font-size="26" fill="#eef2ff" font-weight="700" >AI Diwan</text><text x="48" y="740" font-size="19" fill="#aebbd3" font-weight="400" >Poems, poets and verses with Al-Hakim, an</text><text x="48" y="767" font-size="19" fill="#aebbd3" font-weight="400" >AI companion for exploring Arabic poetry.</text><text x="48" y="861" font-size="12" fill="#fbbf24" font-w