f2ff" font-weight="700" >Make complex data useful</text><text x="48" y="482" font-size="25" fill="#aebbd3" font-weight="400" >Multi-source ELT, medallion pipelines,</text><text x="48" y="515" font-size="25" fill="#aebbd3" font-weight="400" >star schemas and fraud analysis for</text><text x="48" y="548" font-size="25" fill="#aebbd3" font-weight="400" >financial workflows.</text><text x="48" y="641" font-size="15" fill="#22d3ee" font-weight="600" class="mono">AIRFLOW / DBT / POSTGRESQL</text><path class="flow" d="M48 659H552" stroke="#22d3ee" stroke-opacity=".35"/><rect x="24" y="692" width="552" height="310" rx="16" fill="#111a2e" stroke="#34d399" stroke-opacity=".28" /><rect x="25" y="720" width="3" height="52" rx="1" fill="#34d399"/><circle class="pulse" cx="529" cy="739" r="29" fill="#34d399" fill-opacity=".065"/><g transform="translate(514 724) scale(1.25)" fill="none" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path class="icon-line" d="M12 2 3 6v6c0 5 9 10 9 10s9-5 9-10V6z M8 12l3 3 5-6"/></g><text x="48" y="732" font-size="16" fill="#34d399" font-weight="700" class="mono" letter-spacing="1">CYBERSECURITY</text><text x="48" y="774" font-size="30" fill="#eef2ff" font-weight="700" >Think like an adversary</text><text x="48" y="816" font-size="25" fill="#aebbd3" font-weight="400" >CTF competition, penetration testing and</text><text x="48" y="849" font-size="25" fill="#aebbd3" font-weight="400" >vulnerability assessment, with national-</text><text x="48" y="882" font-size="25" fill="#aebbd3" font-weight="400" >team mentoring.</text><text x="48" y="975" font-size="15" fill="#34d399" font-weight="600" class="mono">CTF / BURP SUITE / SECURITY</text><path class="flow" d="M48 993H552" stroke="#34d399" stroke-opacity=".35"/><rect x="24" y="1026" width="552" height="310" rx="16" fill="#111a2e" stroke="#fb7185" stroke-opacity=".28" /><rect x="25" y="1054" width="3" height="52" rx="1" fill="#fb7185"/><circle class="pulse" cx="529" cy="1073" r="29" fill="#fb7185" fill-opacity=".065"/><g transform="translate(514 1058) scale(1.25)" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path class="icon-line" d="m8 5-7 7 7 7 m8-14 7 7-7 7 M14 3l-4 18"/></g><text x="48" y="1066" font-size="16" fill="#fb7185" font-weight="700" class="mono" letter-spacing="1">FULL-STACK SYSTEMS</text><text x="48" y="1108" font-size="30" fill="#eef2ff" font-weight="700" >Own the whole delivery</text><text x="48" y="1150" font-size="25" fill="#aebbd3" font-weight="400" >APIs, interfaces and banking</text><text x="48" y="1183" font-size="25" fill="#aebbd3" font-weight="400" >integrations, from identity verification</text><text x="48" y="1216" font-size="25" fill="#aebbd3" font-weight="400" >to government programs.</text><text x="48" y="1309" font-size="15" fill="#fb7185" font-weight="600" class="mono">NEXT.JS / SPRING BOOT / PYTHON</text><path class="flow" d="M48 1327H552" stroke="#fb7185" stroke-opacity=".35"/><rect x="24" y="1360" width="552" height="310" rx="16" fill="#111a2e" stroke="#fbbf24" stroke-opacity=".28" /><rect x="25" y="1388" width="3" height="52" rx="1" fill="#fbbf24"/><circle class="pulse" cx="529" cy="1407" r="29" fill="#fbbf24" fill-opacity=".065"/><g transform="translate(514 1392) scale(1.25)" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path class="icon-line" d="M7 2h10a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z M9 5h6 M10 19h4"/></g><text x="48" y="1400" font-size="16" fill="#fbbf24" font-weight="700" class="mono" letter-spacing="1">MOBILE &amp; OPERATIONS</text><text x="48" y="1442" font-size="30" fill="#eef2ff" font-weight="700" >Build beyond the browser</text><text x="48" y="1484" font-size="25" fill="#aebbd3" font-weight="400" >Android audio, Flutter projects,</text><text x="48" y="1517" font-size="25" fill="#aebbd3" font-weight="400" >containerized services and repeatable</text><text x="48" y="1550" font-size="25" fill="#aebbd3" font-weight="400" >delivery workflows.</text><text x="48" y="1643" font-size="15" fill="#fbbf24" font-weight="600" class="mono">CAPACITOR / FLUTTER / DOCKER</text><path class="flow" d="M48 1661H552" stroke="#fbbf24" stroke-opacity=".35"/><rect x="24" y="1694" width="552" height="310" rx="16" fill="#111a2e" stroke="#60a5fa" stroke-opacity=".28" /><rect x="25" y="1722" width="3" height="52" rx="1" fill="#60a5fa"/><circle class="pulse" cx="529" cy="1741" r="29" fill="#60a5fa" fill-opacity=".065"/><g transform="translate(514 1726) scale(1.25)" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path class="icon-line" d="M8 2h8 M10 2v7l-6 10q-1 3 2 3h12q3 0 2-3L14 9V2 M7 16h10"/></g><text x="48" y="1734" font-size="16" fill="#60a5fa" font-weight="700" class="mono" letter-spacing="1">LANGUAGE &amp; ACCESSIBILITY</text><text x="48" y="1776" font-size="30" fill="#eef2ff" font-weight="700" >Build for local reality</text><text x="48" y="1818" font-size="25" fill="#aebbd3" font-weight="400" >Arabic poetry, low-resource Hassaniya</text><text x="48" y="1851" font-size="25" fill="#aebbd3" font-weight="400" >NLP and Mauritanian sign-language</text><text x="48" y="1884" font-size="25" fill="#aebbd3" font-weight="400" >research.</text><text x="48" y="1977" font-size="15" fill="#60a5fa" font-weight="600" class="mono">ARABIC NLP / MEDIAPIPE / VISION</text><path class="flow" d="M48 1995H552" stroke="#60a5fa" stroke-opacity=".35"/></g>
<rect x="1" y="1" width="598" height="2026" rx="20" fill="none" stroke="url(#border)" stroke-opacity=".7"/>
