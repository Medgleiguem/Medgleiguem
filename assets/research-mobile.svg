<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1026" viewBox="0 0 600 1026" role="img" aria-labelledby="title desc">
<title id="title">Research in progress</title><desc id="desc">Hassaniya NLP · Laghn: Corpus building, metre definitions and computational prosody; dialect adaptation and evaluation are planned.; Mauritanian signs: Structuring local sign data and developing hand-detection and normalization pipelines for recognition.; Samia accessibility: A community-contributed sign dictionary and Arabic/French communication tools for deaf users.. Decorative animation respects reduced motion.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111a2e"/><stop offset="1" stop-color="#090e1b"/></linearGradient>
 <linearGradient id="border"><stop stop-color="#a78bfa" stop-opacity=".7"/><stop offset=".5" stop-color="#22d3ee" stop-opacity=".3"/><stop offset="1" stop-color="#34d399" stop-opacity=".5"/></linearGradient>
 <radialGradient id="violet"><stop stop-color="#8b5cf6" stop-opacity=".23"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
 <radialGradient id="cyan"><stop stop-color="#22d3ee" stop-opacity=".16"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
 <linearGradient id="shine"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#a0b5dd" stroke-opacity=".045"/></pattern>
 <clipPath id="frame"><rect x="1" y="1" width="598" height="1024" rx="20"/></clipPath>
</defs>
<style>
 text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}
 .mono{font-family:Consolas,'Liberation Mono',monospace}
 .flow{stroke-dasharray:4 16;animation:flow 12s linear infinite}
 .orbit{transform-box:fill-box;transform-origin:center;animation:orbit 36s linear infinite}
 .float{animation:float 9s ease-in-out infinite alternate}
 .pulse{animation:pulse 5s ease-in-out infinite}
 .cursor{animation:cursor 1.4s steps(2,end) infinite}
 .aurora{animation:aurora 18s ease-in-out infinite alternate}
 .trace{stroke-dasharray:80 600;animation:trace 12s linear infinite}
 .icon-line{stroke-dasharray:100;animation:draw 9s ease-in-out infinite}
 .icon-bob{animation:float 5s ease-in-out infinite alternate}
 .beam{animation:beam 14s linear infinite}
 .role{opacity:0;animation:role 20s linear infinite}
 .role.first{opacity:1}
 .r1{animation-delay:5s}.r2{animation-delay:10s}.r3{animation-delay:15s}
 @keyframes flow{to{stroke-dashoffset:-240}}
 @keyframes trace{to{stroke-dashoffset:-1360}}
 @keyframes orbit{to{transform:rotate(360deg)}}
 @keyframes float{to{transform:translateY(-7px)}}
 @keyframes pulse{50%{opacity:.4}}
 @keyframes cursor{50%{opacity:0}}
 @keyframes aurora{to{transform:translate(28px,-16px) scale(1.05)}}
 @keyframes role{0%,22%{opacity:1}25%,100%{opacity:0}}
 @keyframes draw{0%,35%,100%{stroke-dashoffset:0}65%{stroke-dashoffset:90}}
 @keyframes beam{from{transform:translateX(-400px)}to{transform:translateX(1200px)}}
 @media(prefers-reduced-motion:reduce){*{animation:none!important}.role{opacity:0!important}.role.first{opacity:1!important}}
</style>
<g clip-path="url(#frame)"><rect width="600" height="1026" fill="url(#bg)"/>
<rect width="600" height="1026" fill="url(#grid)"/><rect x="24" y="24" width="552" height="310" rx="16" fill="#111a2e" stroke="#a78bfa" stroke-opacity=".28" /><rect x="25" y="52" width="3" height="52" rx="1" fill="#a78bfa"/><circle class="pulse" cx="529" cy="71" r="29" fill="#a78bfa" fill-opacity=".065"/><g transform="translate(514 56) scale(1.25)" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path class="icon-line" d="M4 3h16v18H4z M8 7h8 M8 11h8 M8 15h5"/></g><text x="48" y="64" font-size="16" fill="#a78bfa" font-weight="700" class="mono" letter-spacing="1">ONGOING RESEARCH</text><text x="48" y="106" font-size="30" fill="#eef2ff" font-weight="700" >Hassaniya NLP · Laghn</text><text x="48" y="148" font-size="25" fill="#aebbd3" font-weight="400" >Corpus building, metre definitions and</text><text x="48" y="181" font-size="25" fill="#aebbd3" font-weight="400" >computational prosody; dialect</text><text x="48" y="214" font-size="25" fill="#aebbd3" font-weight="400" >adaptation and evaluation are planned.</text><text x="48" y="307" font-size="15" fill="#a78bfa" font-weight="600" class="mono">LOW-RESOURCE NLP / POETRY</text><path class="flow" d="M48 325H552" stroke="#a78bfa" stroke-opacity=".35"/><rect x="24" y="358" width="552" height="310" rx="16" fill="#111a2e" stroke="#22d3ee" stroke-opacity=".28" /><rect x="25" y="386" width="3" height="52" rx="1" fill="#22d3ee"/><circle class="pulse" cx="529" cy="405" r="29" fill="#22d3ee" fill-opacity=".065"/><g transform="translate(514 390) scale(1.25)" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path class="icon-line" d="M8 2h8 M10 2v7l-6 10q-1 3 2 3h12q3 0 2-3L14 9V2 M7 16h10"/></g><text x="48" y="398" font-size="16" fill="#22d3ee" font-weight="700" class="mono" letter-spacing="1">ONGOING RESEARCH</text><text x="48" y="440" font-size="30" fill="#eef2ff" font-weight="700" >Mauritanian signs</text><text x="48" y="482" font-size="25" fill="#aebbd3" font-weight="400" >Structuring local sign data and</text><text x="48" y="515" font-size="25" fill="#aebbd3" font-weight="400" >developing hand-detection and</text><text x="48" y="548" font-size="25" fill="#aebbd3" font-weight="400" >normalization pipelines for recognition.</text><text x="48" y="641" font-size="15" fill="#22d3ee" font-weight="600" class="mono">MEDIAPIPE / VISION / CORPORA</text><path class="flow" d="M48 659H552" stroke="#22d3ee" stroke-opacity=".35"/><rect x="24" y="692" width="552" height="310" rx="16" fill="#111a2e" stroke="#34d399" stroke-opacity=".28" /><rect x="25" y="720" width="3" height="52" rx="1" fill="#34d399"/><circle class="pulse" cx="529" cy="739" r="29" fill="#34d399" fill-opacity=".065"/><g transform="translate(514 724) scale(1.25)" fill="none" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path class="icon-line" d="M7 2h10a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z M9 5h6 M10 19h4"/></g><text x="48" y="732" font-size="16" fill="#34d399" font-weight="700" class="mono" letter-spacing="1">IN DESIGN</text><text x="48" y="774" font-size="30" fill="#eef2ff" font-weight="700" >Samia accessibility</text><text x="48" y="816" font-size="25" fill="#aebbd3" font-weight="400" >A community-contributed sign dictionary</text><text x="48" y="849" font-size="25" fill="#aebbd3" font-weight="400" >and Arabic/French communication tools</text><text x="48" y="882" font-size="25" fill="#aebbd3" font-weight="400" >for deaf users.</text><text x="48" y="975" font-size="15" fill="#34d399" font-weight="600" class="mono">ACCESSIBILITY / LANGUAGE / COMMUNITY</text><path class="flow" d="M48 993H552" stroke="#34d399" stroke-opacity=".35"/></g>
<rect x="1" y="1" width="598" height="1024" rx="20" fill="none" stroke="url(#border)" stroke-opacity=".7"/>
</svg>
