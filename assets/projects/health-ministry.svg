<svg xmlns="http://www.w3.org/2000/svg" width="720" height="370" viewBox="0 0 720 370" role="img" aria-labelledby="title desc">
<title id="title">Health Ministry AI</title><desc id="desc">Scoped evidence. Human decisions. Animated illustrative engineering diagram. Open the card for the public engineering brief; source code is private.</desc>
<defs><clipPath id="frame"><rect width="720" height="370"/></clipPath>
<linearGradient id="shade"><stop stop-color="#030b17" stop-opacity=".84"/><stop offset=".6" stop-color="#030b17" stop-opacity=".17"/><stop offset="1" stop-color="#030b17" stop-opacity="0"/></linearGradient>
<linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#08121f" stop-opacity="0"/><stop offset="1" stop-color="#08121f"/></linearGradient></defs>
<style>
text{font-family:Consolas,'Liberation Mono',monospace}
.serif{font-family:Georgia,'Liberation Serif',serif}
.camera{transform-origin:center;animation:camera 22s ease-in-out infinite alternate}
.flow{stroke-dasharray:10 210;animation:flow 10s linear infinite}
.fast{animation-duration:7s}.slow{animation-duration:13s}
.glow{animation:glow 8s ease-in-out infinite}
.rotor{transform-origin:1380px 223px;animation:rotor 48s linear infinite}
.trace{stroke-dasharray:600;animation:trace 11s ease-in-out infinite}
.meter{animation:meter 8s ease-in-out infinite}
@keyframes camera{to{transform:scale(1.025)}}
@keyframes flow{to{stroke-dashoffset:-660}}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:.9}}
@keyframes rotor{to{transform:rotate(360deg)}}
@keyframes trace{0%,12%{stroke-dashoffset:600;opacity:.35}55%,80%{stroke-dashoffset:0;opacity:.9}100%{stroke-dashoffset:-600;opacity:.35}}
@keyframes meter{0%,100%{opacity:.35}45%,65%{opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.flow{stroke-dasharray:none;opacity:.4}.trace{stroke-dasharray:none;stroke-dashoffset:0}}
</style><g clip-path="url(#frame)"><rect width="720" height="370" fill="#08121f"/><style>
.packet{stroke-dasharray:12 90;animation:packet 7s linear infinite}
.float{animation:float 9s ease-in-out infinite alternate}
.scanner{animation:scanner 8s ease-in-out infinite}
@keyframes packet{to{stroke-dashoffset:-408}}
@keyframes float{to{transform:translateY(-10px)}}
@keyframes scanner{0%,100%{transform:translateY(0);opacity:.3}50%{transform:translateY(120px);opacity:.9}}
</style><rect x="1" y="1" width="718" height="368" rx="12" fill="#0d1b29" stroke="#304b61"/><text x="28" y="55" font-size="34" fill="#e8edf2" class="serif">Health Ministry AI</text><text x="28" y="96" font-size="21" fill="#dbb277" >Scoped evidence. Human decisions.</text><rect x="75" y="155" width="86" height="103" rx="5" fill="#102435" stroke="#7da5bf"/><path d="M91 180h54m-54 20h54m-54 20h41" stroke="#8eafc7" stroke-width="2"/><rect x="90" y="167" width="86" height="103" rx="5" fill="#102435" stroke="#7da5bf"/><path d="M106 192h54m-54 20h54m-54 20h41" stroke="#8eafc7" stroke-width="2"/><path d="M180 216H303" fill="none" stroke="#345269" stroke-width="2"/><path class="packet" style="animation-delay:-0s" d="M180 216H303" fill="none" stroke="#a4d3ee" stroke-width="3"/><g fill="none" stroke="#a4d3ee"><circle cx="360" cy="216" r="43"/><circle class="glow" cx="360" cy="216" r="55" stroke-dasharray="3 12"/><path d="M345 216h30m-15-15v30"/></g><path d="M415 216H536" fill="none" stroke="#345269" stroke-width="2"/><path class="packet" style="animation-delay:-3s" d="M415 216H536" fill="none" stroke="#a4d3ee" stroke-width="3"/><rect x="536" y="180" width="130" height="75" rx="8" fill="#122536" stroke="#dbb277"/><circle cx="600" cy="203" r="9" fill="none" stroke="#e5c797"/><path d="M582 234q0-25 18-25t18 25" fill="none" stroke="#e5c797"/><text x="94" y="298" font-size="18" fill="#a7bacc" >SOURCES</text><text x="330" y="298" font-size="18" fill="#a7bacc" >SCOPE</text><text x="568" y="298" font-size="18" fill="#a7bacc" >REVIEW</text><text x="28" y="350" font-size="15" fill="#a7bacc" >SYSTEM / PRIVATE CODE</text><text x="690" y="350" font-size="16" fill="#dbb277" text-anchor="end">EXPLORE BRIEF ↗</text></g></svg>
