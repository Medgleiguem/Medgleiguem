<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="165" viewBox="0 0 1000 165" role="img" aria-labelledby="title desc">
<title id="title">Night dunes — contact links below</title><desc id="desc">Original vector dunes with traveling sand-gold highlights and a cyan signal. GitHub, LinkedIn and email are individual native links below this illustration.</desc>
<defs><clipPath id="clip"><rect width="1000" height="165" rx="4"/></clipPath>
<linearGradient id="shade"><stop stop-color="#080d12" stop-opacity=".85"/><stop offset=".48" stop-color="#080d12" stop-opacity=".35"/><stop offset="1" stop-color="#080d12" stop-opacity="0"/></linearGradient>
<linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#080d12" stop-opacity="0"/><stop offset="1" stop-color="#080d12"/></linearGradient>
</defs><style>
text{font-family:'Liberation Sans',Arial,sans-serif}
.mono{font-family:Consolas,'Liberation Mono',monospace}
.name{font-family:'Liberation Sans Narrow','Arial Narrow',Arial,sans-serif;font-weight:900}
.flow{stroke-dasharray:2 98;animation:travel 10s linear infinite}
.sand{stroke-dasharray:14 86;animation:travel 18s linear infinite}
.slow{animation-duration:17s}.fast{animation-duration:7s}
.breathe{animation:breathe 8s ease-in-out infinite}
.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 90s linear infinite}
@keyframes travel{to{stroke-dashoffset:-100}}
@keyframes breathe{0%,100%{opacity:.3}50%{opacity:.85}}
@keyframes orbit{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.flow,.sand{stroke-dasharray:none;opacity:.45}}
</style><g clip-path="url(#clip)"><rect width="1000" height="165" fill="#080d12"/><path d="M0 57Q170.0 17 430.0 60T1000 42V165H0Z" fill="#18232b"/><path class="sand" style="animation-delay:-0s" pathLength="100" d="M0 57Q170.0 17 430.0 60T1000 42" stroke="#e2b76f" stroke-width="1" fill="none"/><path d="M0 73Q170.0 33 430.0 76T1000 58V165H0Z" fill="#172028"/><path class="sand" style="animation-delay:-3s" pathLength="100" d="M0 73Q170.0 33 430.0 76T1000 58" stroke="#e2b76f" stroke-width="1" fill="none"/><path d="M0 89Q170.0 49 430.0 92T1000 74V165H0Z" fill="#23272a"/><path class="sand" style="animation-delay:-6s" pathLength="100" d="M0 89Q170.0 49 430.0 92T1000 74" stroke="#e2b76f" stroke-width="1" fill="none"/><path d="M0 105Q170.0 65 430.0 108T1000 90V165H0Z" fill="#121d25"/><path class="sand" style="animation-delay:-9s" pathLength="100" d="M0 105Q170.0 65 430.0 108T1000 90" stroke="#e2b76f" stroke-width="1" fill="none"/><path d="M0 121Q170.0 81 430.0 124T1000 106V165H0Z" fill="#0b151d"/><path class="sand" style="animation-delay:-12s" pathLength="100" d="M0 121Q170.0 81 430.0 124T1000 106" stroke="#e2b76f" stroke-width="1" fill="none"/><path d="M20 45Q350.0 4 980 46" fill="none" stroke="#55dce3" stroke-width="1" opacity=".18"/><path class="flow slow" pathLength="100" d="M20 45Q350.0 4 980 46" fill="none" stroke="#55dce3" stroke-width="2.4" stroke-linecap="round" style="animation-delay:-5s"/><path d="M24 10H976l14 14V141l-14 14H24L10 141V24Z" fill="none" stroke="#e2b76f" stroke-opacity=".55"/><path d="M24 4l6 6-6 6-6-6Z" fill="#080d12" stroke="#e2b76f" stroke-width="1.2"/><path d="M976 149l6 6-6 6-6-6Z" fill="#080d12" stroke="#e2b76f" stroke-width="1.2"/></g></svg>
