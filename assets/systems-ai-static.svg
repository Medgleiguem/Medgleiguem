<title id="title">AI + KNOWLEDGE SYSTEMS</title><desc id="desc">Health Ministry AI: Dossiers, source-grounded assistance, decisions and follow-up. Flow: Source documents, Scoped retrieval, Human decision, Follow-up; Central Bank RAG / RKF: Governed legal and financial evidence for source-cited retrieval. Flow: Source registry, Language + version, Expert review, Hybrid retrieval; ARE intelligence: Regulatory evidence, obligations and decision-support views. Flow: Regulatory sources, Reviewed evidence, Obligations, Decision workspace; National Knowledge Base: Provenance, private document previews and dataset-review workflows. Flow: Import sources, Staff library, Inspect evidence, Dataset review. All motion stops for reduced-motion preferences.</desc>
