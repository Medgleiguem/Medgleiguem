<g clip-path="url(#frame)"><rect width="1000" height="380" fill="#060b0e" /><text x="24" y="33" font-size="13" fill="#43e6f6" font-weight="600">RESEARCH / IN PROGRESS</text><text x="24" y="82" font-size="28" fill="#b7ff5a" font-weight="600">hassaniya-laghn/</text><text x="24" y="122" font-size="21" fill="#9ab8b0" font-weight="400">Corpus, metre rules and computational prosody.</text><text x="24" y="170" font-size="18" fill="#43e6f6" font-weight="400">COLLECT → NORMALIZE → CHECK METRE → REVIEW</text><path class="flow" d="M24 211H976" stroke="#345e45" /><text x="24" y="242" font-size="28" fill="#b7ff5a" font-weight="600">mauritanian-signs/</text><text x="24" y="282" font-size="21" fill="#9ab8b0" font-weight="400">Local sign corpus and recognition research.</text><text x="24" y="330" font-size="18" fill="#43e6f6" font-weight="400">COLLECT → DETECT HANDS → NORMALIZE → EVALUATE</text><path class="flow" d="M24 371H976" stroke="#345e45" /></g>
