<svg xmlns="http://www.w3.org/2000/svg" width="600" height="570" viewBox="0 0 600 570" role="img" aria-labelledby="title desc">
<title id="title">Mohamed Gleiguem — Intelligence. Engineered.</title>
<desc id="desc">Custom artwork for Mohamed Gleiguem. Decorative motion stops when reduced motion is requested. All text remains visible without animation.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101c2c"/><stop offset="1" stop-color="#080e17"/></linearGradient>
  <linearGradient id="edge"><stop stop-color="#70f0cb" stop-opacity=".55"/><stop offset=".6" stop-color="#9daaff" stop-opacity=".22"/><stop offset="1" stop-color="#70f0cb" stop-opacity=".1"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#70f0cb" stop-opacity=".1"/><stop offset="1" stop-color="#70f0cb" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#a5b9d3" opacity=".13"/></pattern>
  <clipPath id="frame"><rect x="1" y="1" width="598" height="568" rx="20"/></clipPath>
</defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
.mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
.flow { stroke-dasharray: 3 18; animation: flow 16s linear infinite; }
.halo { transform-box: fill-box; transform-origin: center; animation: breathe 8s ease-in-out infinite; }
@keyframes flow { to { stroke-dashoffset: -252; } }
@keyframes breathe { 50% { opacity: .45; transform: scale(.94); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<g clip-path="url(#frame)">
<rect width="600" height="570" fill="url(#bg)"/>
<rect width="600" height="570" fill="url(#grid)"/>
<ellipse cx="560" cy="20" rx="380" ry="300" fill="url(#glow)"/><text x="40" y="57" font-size="17" fill="#70f0cb" font-weight="700" class="mono" letter-spacing="2.5">MOHAMED GLEIGUEM</text><text x="40" y="91" font-size="12" fill="#9baabd" font-weight="500" class="mono" letter-spacing="2">AI &amp; SOFTWARE ENGINEERING</text><text x="40" y="178" font-size="62" fill="#f0f3f5" font-weight="700" letter-spacing="-2">Intelligence.</text><text x="40" y="250" font-size="62" fill="#70f0cb" font-weight="700" letter-spacing="-2">Engineered.</text><text x="40" y="309" font-size="22" fill="#b1bccb" font-weight="400" >From source-cited AI to software</text><text x="40" y="341" font-size="22" fill="#b1bccb" font-weight="400" >that people use.</text><path class="flow" d="M40 396H560" stroke="#70f0cb" stroke-opacity=".6"/><text x="40" y="444" font-size="17" fill="#d6dfe8" font-weight="600" class="mono">AI / DATA / SECURITY</text><text x="40" y="476" font-size="17" fill="#d6dfe8" font-weight="600" class="mono">WEB / MOBILE / RESEARCH</text><text x="40" y="535" font-size="13" fill="#a5b4c7" font-weight="500" class="mono">NOUAKCHOTT, MAURITANIA · UTC+0</text>
</g>
<rect x="1" y="1" width="598" height="568" rx="20" fill="none" stroke="url(#edge)"/>
</svg>
